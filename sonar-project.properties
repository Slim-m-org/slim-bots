# SonarQube Cloud analysis scope, read by .github/workflows/sonar.yml.

sonar.projectKey=Slim-m-org_slim-bots
sonar.organization=slim-m-org
sonar.projectName=slim-bots
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Tests are scanned under test rules rather than counted as bot or library code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  slimbots/tests/**,\
  slimbots/tests_livekit/**,\
  scripts/tests/**,\
  bots/*/test_*.py
sonar.exclusions=\
  slimbots/tests/**,\
  slimbots/tests_livekit/**,\
  scripts/tests/**,\
  bots/*/test_*.py,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  LICENSES/**
