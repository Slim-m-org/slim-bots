# SonarQube Cloud analysis scope, read by .github/workflows/sonar.yml.

sonar.projectKey=Slim-m-org_slim-bots
sonar.organization=slim-m-org
sonar.projectName=slim-bots
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Tests are scanned under test rules rather than counted as bot or library code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  slimbots/tests/**,\
  slimbots/tests_livekit/**,\
  scripts/tests/**,\
  scripts/smoke_all.py,\
  bots/*/test_*.py
sonar.exclusions=\
  slimbots/tests/**,\
  slimbots/tests_livekit/**,\
  scripts/tests/**,\
  scripts/smoke_all.py,\
  bots/*/test_*.py,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  LICENSES/**

# Coverage is not reported yet, so the gate's coverage-on-new-code condition
# would fail every pull request; excluding everything from coverage leaves it
# with nothing to measure until coverage reports are wired in and this goes.
sonar.coverage.exclusions=**/*
