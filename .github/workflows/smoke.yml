name: smoke

# Boots the published slim-m server image, claims it, and types every manifest's commands at the real bots.
# Weekly and on demand, never on a pull request: it needs the network and the image, and a red run means a
# bot or the server drifted, not that a change is bad.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONPATH: ${{ github.workspace }}/slimbots

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install every bot's shared runtime dependencies (hash-locked, wheel-only)
        run: "python -m pip install --only-binary=:all: --require-hashes -r bot-templates-requirements.lock.txt"
      - name: Start a fresh slim-m server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name slimm -p 18080:8080 ghcr.io/slim-m-org/slim-m-server:latest
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/healthz
      - name: Smoke every manifest
        run: python scripts/smoke_all.py --base-url http://127.0.0.1:18080
      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-transcripts
          path: smoke-transcripts/*.md
          if-no-files-found: ignore
      - name: Server log on failure
        if: failure()
        run: docker logs slimm | tail -100
