name: publish

# Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is
# no API token to store or rotate. The environment below must match the one
# named on the PyPI publisher, or the token exchange is refused.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the distribution
        working-directory: slimbots
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-build.lock.txt
          python -m build --no-isolation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: slimbots/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The PyPI publisher also names this repo's owner, so a repo move needs a new publisher there first.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
