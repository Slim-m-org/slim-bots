name: publish

# Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is
# no API token to store or rotate. The environment below must match the one
# named on the PyPI publisher, or the token exchange is refused.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the distribution
        working-directory: slimbots
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-build.lock.txt
          python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: slimbots/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The PyPI publisher also names this repo's owner, so a repo move needs a new publisher there first.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
