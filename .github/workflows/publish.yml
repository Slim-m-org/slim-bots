name: publish

# Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is
# no API token to store or rotate. The environment below must match the one
# named on the PyPI publisher, or the token exchange is refused.
# A manual run only does anything from a release tag.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A PyPI version is immutable, so a red commit must not become one.
  test:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refuse a tag that is not the package version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py "$TAG"
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not a commit on main"; exit 1; }
      - name: Build the distribution
        working-directory: slimbots
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-build.lock.txt
          python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: slimbots/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PyPI publisher also names this repo's owner, so a repo move needs a new publisher there first.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
